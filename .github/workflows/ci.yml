name: CI

on:
  workflow_dispatch:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25'
      - name: Generate controller code
        run: |
          go install sigs.k8s.io/controller-tools/cmd/controller-gen@v0.17.0
          /home/runner/go/bin/controller-gen object:headerFile="" paths="./api/..."
      - name: Run gofmt
        run: gofmt -l . | tee /tmp/gofmt.txt && test -z "$(cat /tmp/gofmt.txt)"
      - name: Run go vet
        run: go vet ./...
      - name: Run tests
        run: go test ./... -v
      - name: Log in to GHCR
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push webhook image
        uses: docker/build-push-action@v7
        with:
          file: Dockerfile.webhook
          push: true
          platforms: linux/amd64
          tags: ghcr.io/${{ github.repository_owner }}/vault-webhook:latest
      - name: Build and push runner image
        uses: docker/build-push-action@v7
        with:
          file: Dockerfile.runner
          push: true
          platforms: linux/amd64
          tags: ghcr.io/${{ github.repository_owner }}/vault-runner:latest
      - name: Build and push controller image
        uses: docker/build-push-action@v7
        with:
          file: cmd/controller/Dockerfile
          push: true
          platforms: linux/amd64
          tags: ghcr.io/${{ github.repository_owner }}/vault-controller:latest
          build-args: |
            
      - name: Lint Kubernetes manifests
        run: |
          python -m pip install --user pyyaml
          python - <<'PY'
          from pathlib import Path
          import yaml

          files = sorted(Path('k8s').glob('*.yaml'))
          if not files:
              raise SystemExit('No manifest files found')

          for path in files:
              with path.open('r', encoding='utf-8') as fh:
                  yaml.safe_load_all(fh)
              print(f'Validated {path}')
          PY
